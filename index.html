<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT Tablet Follow-up</title>
    <link rel="icon" type="image/png" href="disease.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="root">
        <!-- Loading state while scripts load -->
        <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:1rem;">
            <img src="disease.png" alt="Loading" width="64" height="64" style="opacity:0.6;">
            <p style="color:#6b7280;font-family:'DM Sans',sans-serif;">Loading PT Tablet Follow-up...</p>
        </div>
    </div>

    <!-- 1. React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

    <!-- 2. Babel Standalone (for JSX transpilation) -->
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

    <!-- 3. Data file (plain JS, no JSX needed) -->
    <script src="data.js"></script>

    <!-- 4. App component (contains JSX, needs Babel) -->
    <script type="text/babel" src="app.js"></script>
</body>
</html>
